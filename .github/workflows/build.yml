name: Build TweakForce (.deb)

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Packages (RootHide)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools (ldid and dpkg)
        run: |
          echo "[CI] Installing ldid and dpkg via Homebrew..."
          brew install ldid dpkg

      - name: Setup Theos and Patched SDKs
        run: |
          echo "[CI] Cloning RootHide Theos..."
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          echo "[CI] Cloning patched iOS SDKs..."
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"

          # Создаем алиас SDK 16.5 под имя 16.0 для совместимости
          ln -sf "$HOME/theos/sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/iPhoneOS16.0.sdk"

          # Создаем алиасы libellekit -> libsubstrate
          cp "$HOME/theos/vendor/lib/libsubstrate.tbd" "$HOME/theos/vendor/lib/libellekit.tbd" 2>/dev/null || true
          cp "$HOME/theos/vendor/lib/libsubstrate.tbd" "$HOME/theos/lib/libellekit.tbd" 2>/dev/null || true

      - name: Adapt Makefiles and Headers for latest SDK
        run: |
          python3 - << 'PYEOF'
          import os
          for root, _, files in os.walk('.'):
              for f in files:
                  p = os.path.join(root, f)
                  if f == 'Makefile':
                      with open(p, 'r') as fp:
                          c = fp.read()
                      c = c.replace('16.0:15.0', 'latest:15.0').replace('16.5:15.0', 'latest:15.0').replace('ellekit', 'substrate')
                      if '2_InjectionDaemon' in p and '-undefined dynamic_lookup' not in c:
                          c += '\ntweakforced_LDFLAGS += -undefined dynamic_lookup\n'
                      with open(p, 'w') as fp:
                          fp.write(c)
                  elif f == 'PACBypass.h':
                      with open(p, 'r') as fp:
                          c = fp.read()
                      c = c.replace('#if __has_include(<mach/mach_vm.h>)', '#if 0')
                      c = c.replace('#if !__has_include(<mach/mach_vm.h>)', '#if 1')
                      c = c.replace('#include <mach/mach_vm.h>', '// #include <mach/mach_vm.h>')
                      with open(p, 'w') as fp:
                          fp.write(c)
                  elif f == 'ProcessMonitor.m':
                      with open(p, 'r') as fp:
                          c = fp.read()
                      libproc_decl = (
                          '#if __has_include(<libproc.h>)\n'
                          '#import <libproc.h>\n'
                          '#else\n'
                          '#ifndef PROC_ALL_PIDS\n'
                          '#define PROC_ALL_PIDS 1\n'
                          '#endif\n'
                          '#ifndef PROC_PIDPATHINFO_MAXSIZE\n'
                          '#define PROC_PIDPATHINFO_MAXSIZE (4 * 1024)\n'
                          '#endif\n'
                          'int proc_listpids(uint32_t type, uint32_t typeinfo, void *buffer, int buffersize);\n'
                          'int proc_pidpath(int pid, void *buffer, uint32_t buffersize);\n'
                          '#endif'
                      )
                      c = c.replace('#import <libproc.h>', libproc_decl)
                      with open(p, 'w') as fp:
                          fp.write(c)
          print("[CI] Adaptation completed successfully.")
          PYEOF

      - name: Build TweakForce (roothide)
        env:
          THEOS: ${{ env.THEOS }}
          THEOS_PACKAGE_SCHEME: roothide
          FINALPACKAGE: 1
        run: |
          echo "[CI] Building subprojects for RootHide..."
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Assemble All-In-One Suite
        env:
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          echo "[CI] Creating all-in-one .deb package..."
          chmod +x ./package_all_in_one.sh || true
          ./package_all_in_one.sh || echo "[CI] Note: package_all_in_one script finished"

      - name: Collect Debian packages
        run: |
          mkdir -p output_debs
          find . -name "*.deb" -exec cp {} output_debs/ \;
          echo "[CI] Collected packages:"
          ls -lh output_debs/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweakforce-roothide-deb
          path: output_debs/*.deb
          if-no-files-found: error
