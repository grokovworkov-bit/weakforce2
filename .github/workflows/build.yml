name: Build TweakForce (.deb)

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Packages
    runs-on: macos-14
    strategy:
      matrix:
        scheme: [roothide, rootless]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos with RootHide support
        run: |
          echo "[CI] Cloning RootHide Theos..."
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          echo "[CI] Cloning patched iOS SDKs..."
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"

      - name: Build TweakForce (${{ matrix.scheme }})
        env:
          THEOS: ${{ env.THEOS }}
          THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
          FINALPACKAGE: 1
        run: |
          echo "[CI] Building subprojects for scheme: ${{ matrix.scheme }}..."
          make clean
          make package THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} FINALPACKAGE=1

      - name: Assemble All-In-One Suite (${{ matrix.scheme }})
        env:
          THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
        run: |
          echo "[CI] Creating all-in-one .deb package..."
          chmod +x ./package_all_in_one.sh
          ./package_all_in_one.sh

      - name: Collect Debian packages
        run: |
          mkdir -p output_debs
          find . -name "*.deb" -exec cp {} output_debs/ \;
          echo "[CI] Collected packages:"
          ls -lh output_debs/

      - name: Upload Artifacts (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: tweakforce-${{ matrix.scheme }}-debs
          path: output_debs/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_debs

      - name: Flatten packages
        run: |
          mkdir -p release_packages
          find all_debs -name "*.deb" -exec cp {} release_packages/ \;
          ls -la release_packages/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_packages/*.deb
          generate_release_notes: true
